name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend - unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The end-to-end test uses Testcontainers (pgvector); the ubuntu runner has Docker available.
      - name: Test
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress test
      - name: Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: frontend - type-check, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type-check
        working-directory: frontend
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  ml:
    name: ml - pipeline smoke (generate, train, export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install
        run: pip install -r ml/requirements.txt
      - name: Reproduce the exported artefacts
        working-directory: ml
        run: |
          python generate_data.py > /dev/null
          python train_and_export.py > /dev/null
          python personas.py > /dev/null
      - name: Exported artefacts are unchanged (pipeline is deterministic; only trained_at differs)
        run: |
          git diff --exit-code --stat -- backend/src/main/resources/model/fraud_rules.json backend/src/main/resources/demo/personas.json backend/src/main/resources/model/historical_sample.json
          python - <<'PY'
          import json, subprocess, sys
          for f in ["backend/src/main/resources/model/scorecard.json", "backend/src/main/resources/model/model_card.json"]:
              committed = json.loads(subprocess.check_output(["git", "show", f"HEAD:{f}"]))
              regenerated = json.load(open(f))
              committed.pop("trained_at", None); regenerated.pop("trained_at", None)
              if committed != regenerated:
                  print("regenerated artefact differs from the committed one:", f); sys.exit(1)
          print("artefacts reproduce exactly")
          PY
