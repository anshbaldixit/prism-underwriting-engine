openapi: 3.1.0
info:
  title: Prism Underwriting API
  version: 0.1.0
  description: |
    API-first surface of the Prism multi-modal underwriting engine. All endpoints except `POST /api/auth/login`
    and `/actuator/health` require `Authorization: Bearer <JWT>`. Errors are RFC 9457 problem details.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - { name: auth }
  - { name: applications, description: Submit, read and act on applications }
  - { name: ai, description: Copilot and policy retrieval (underwriter/admin) }
  - { name: model, description: Transparency endpoints (underwriter/admin) }
paths:
  /api/auth/login:
    post:
      tags: [auth]
      security: []
      summary: Exchange username/password for a JWT (HS256, 8 h)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string } } }
      responses:
        '200': { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { description: Invalid credentials }
        '429': { description: Rate limited (30/min per client) }
  /api/demo/personas:
    get:
      tags: [applications]
      summary: Synthetic demo personas with three-month statements
      responses:
        '200': { description: Personas, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /api/applications:
    post:
      tags: [applications]
      summary: Submit an application and receive the real-time decision
      description: Runs categorisation → cash-flow features → fraud gate → scorecard → policy → guardrailed notice. Roles APPLICANT, UNDERWRITER, ADMIN.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SubmitApplicationRequest' } } }
      responses:
        '201': { description: Decided application, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationDetail' } } } }
        '400': { description: Validation failure or bank data without consent }
    get:
      tags: [applications]
      summary: List applications (applicants see only their own)
      parameters:
        - { name: status, in: query, schema: { type: array, items: { type: string, enum: [RECEIVED, DECIDED, REFERRED, OVERRIDDEN] } } }
      responses:
        '200': { description: Summaries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ApplicationSummary' } } } } }
  /api/applications/{id}:
    get:
      tags: [applications]
      summary: Full application detail with decision, cash-flow evidence, similar cohort and actions
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Detail, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationDetail' } } } }
        '403': { description: Applicant reading another applicant's case }
        '404': { description: Not found }
  /api/applications/{id}/summary:
    get:
      tags: [applications]
      summary: Underwriter summary (generated by the guardrailed LLM on first request, then cached)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Summary JSON (headline, strengths, risks, verification_items, recommendation, cited_factors) }
  /api/applications/{id}/actions:
    post:
      tags: [applications]
      summary: Record an underwriter action (confirm, request docs, override)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [action, reason], properties: { action: { type: string, enum: [CONFIRM, REQUEST_DOCS, APPROVE_OVERRIDE, DECLINE_OVERRIDE] }, reason: { type: string, minLength: 20, maxLength: 600 } } }
      responses:
        '200': { description: Updated detail, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationDetail' } } } }
  /api/copilot/ask:
    post:
      tags: [ai]
      summary: Retrieval-orchestrated copilot answer with policy citations
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [question], properties: { applicationId: { type: string, format: uuid }, question: { type: string, maxLength: 600 } } }
      responses:
        '200': { description: Answer, citations, provider, fallbackUsed, retrieved chunks, latencyMs }
  /api/policy/search:
    get:
      tags: [ai]
      summary: Vector search over internal policy sections
      parameters: [{ name: q, in: query, required: true, schema: { type: string, maxLength: 300 } }]
      responses:
        '200': { description: Chunks with doc, section, content, similarity }
  /api/model/card:
    get: { tags: [model], summary: Model card (performance, policy simulation, fairness, fraud gate, limitations), responses: { '200': { description: JSON } } }
  /api/model/scorecard:
    get: { tags: [model], summary: The scorecard itself - bins, WoE, coefficients, reason codes, decision policy, responses: { '200': { description: JSON } } }
  /api/model/fraud-rules:
    get: { tags: [model], summary: Fraud gate rules and thresholds, responses: { '200': { description: JSON } } }
  /api/model/ai-config:
    get: { tags: [model], summary: Active AI providers and guardrail configuration, responses: { '200': { description: JSON } } }
  /api/monitoring/summary:
    get: { tags: [model], summary: Decision mix, score bands, latency, override rate, per-provider AI stats, responses: { '200': { description: JSON } } }
  /actuator/health:
    get: { security: [], summary: Liveness/readiness, responses: { '200': { description: UP } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Session:
      type: object
      properties: { token: { type: string }, username: { type: string }, displayName: { type: string }, role: { type: string, enum: [APPLICANT, UNDERWRITER, ADMIN] }, expiresAt: { type: string, format: date-time } }
    SubmitApplicationRequest:
      type: object
      required: [applicant, loan, consent, bureau]
      properties:
        applicant:
          type: object
          required: [fullName, email, employmentType, statedAnnualIncome]
          properties:
            fullName: { type: string, maxLength: 120 }
            email: { type: string, format: email }
            phone: { type: string, maxLength: 40 }
            nationalId: { type: string, description: 9 or 12 digits; stored only as a keyed hash }
            employmentType: { type: string, enum: [FULL_TIME, PART_TIME, SELF_EMPLOYED, STUDENT, UNEMPLOYED, RETIRED] }
            statedAnnualIncome: { type: number, minimum: 0, maximum: 10000000 }
        loan:
          type: object
          required: [requestedAmount]
          properties: { requestedAmount: { type: number, minimum: 300, maximum: 20000 }, purpose: { type: string, maxLength: 300 } }
        consent:
          type: object
          properties: { bankData: { type: boolean }, altData: { type: boolean } }
        bureau:
          type: object
          required: [fileType]
          properties:
            fileType: { type: string, enum: [thick, thin, ntc] }
            bureauScore: { type: number, minimum: 300, maximum: 850 }
            monthsOnFile: { type: number }
            tradelines: { type: number }
            inquiries6m: { type: number }
            delinquencies24m: { type: number }
        behaviour:
          type: object
          description: Captured client-side; used by the fraud gate only
          properties:
            sessionSeconds: { type: number }
            incomeFieldEdits: { type: integer }
            pasteSsn: { type: boolean }
            pasteIncome: { type: boolean }
            emailAgeDays: { type: number }
            voipPhone: { type: boolean }
            deviceId: { type: string, maxLength: 80 }
            deviceAppsLast30dSeed: { type: integer, description: Demo-only simulated prior applications from this device }
        transactions:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [date, description, amount]
            properties: { date: { type: string, format: date }, description: { type: string, maxLength: 200 }, amount: { type: number }, balanceAfter: { type: number } }
        personaId: { type: string, maxLength: 64 }
    ApplicationSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        status: { type: string }
        applicant: { type: string, description: masked name }
        fileType: { type: string }
        bankLinked: { type: boolean }
        requestedAmount: { type: number }
        decision: { type: string, enum: [APPROVE, REFER, DECLINE] }
        basis: { type: string }
        score: { type: integer }
        pd: { type: number }
        fraudOutcome: { type: string, enum: [PASS, STEP_UP, BLOCK] }
    ApplicationDetail:
      type: object
      description: See backend ApplicationDetail record; includes applicant (masked per role), loan, bureau, behaviour, decision (score, pd, creditLimit, apr, reasonCodes, contributions, verificationItems, policyNotes, fraud, notice, noticeProvider, noticeValidated, noticeFallbackUsed, summary), cashflow (features, categorised transactions), similar cohort and underwriter actions.
